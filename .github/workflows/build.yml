name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: SharmatixGrid-${{ runner.os }}
          path: |
            build/SharmatixGrid_artefacts/Release/VST3
            build/SharmatixGrid_artefacts/Release/AU
          if-no-files-found: warn
